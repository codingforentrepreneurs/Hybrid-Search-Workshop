name: hybrid-search-demo

# Run from the repository root: rav run <command>
# Keep flags in these commands: Rav 0.4.3 does not forward CLI keyword options.
scripts:
  # Install dependencies and create .env only if it does not already exist.
  setup:
    - uv sync
    - >-
      uv run python -c "from pathlib import Path; target = Path('.env'); target.exists() or target.write_bytes(Path('.env.sample').read_bytes())"
  sync: uv sync
  install-fastembed: uv add fastembed==0.9.0

  # Django reads configuration from the repository-root .env.
  server: uv run python src/manage.py runserver
  shell: uv run python src/manage.py shell
  check: uv run python src/manage.py check
  makemigrations: uv run python src/manage.py makemigrations
  migrate: uv run python src/manage.py migrate
  migrations: uv run python src/manage.py showmigrations
  collectstatic: uv run python src/manage.py collectstatic --noinput

  # Preparation writes JSONL without connecting to a database or embedding API.
  prepare: uv run scripts/load_movies.py --prepare-only
  load: uv run scripts/load_movies.py
  load-sample: uv run scripts/load_movies.py --limit 1000
  load-all: uv run scripts/load_movies.py --limit 0

  # Inspect pending work first. OpenRouter embedding runs use account credits.
  embed-plan: uv run python src/manage.py embed_movies --dry-run
  embed: uv run python src/manage.py embed_movies --batch-size 128 --workers 4 --request-batch-size 32
  embed-serial: uv run python src/manage.py embed_movies --batch-size 128 --workers 1 --request-batch-size 16
  embed-sample: uv run python src/manage.py embed_movies --limit 100
  indexes: uv run python src/manage.py setup_search_indexes

  # Isolated SQLite tests; never use the Tiger Cloud database in .env.
  test: uv run python src/manage.py test movies --settings=config.test_settings
  verify:
    - uv run python src/manage.py check --settings=config.test_settings
    - uv run python src/manage.py makemigrations --check --dry-run --settings=config.test_settings
    - uv run python src/manage.py test movies --settings=config.test_settings
